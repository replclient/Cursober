<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Cursober</title>
  <desc>A violet cursor overlapping a tilted Sober-inspired geometric mark, on a transparent background.</desc>
  <defs>
    <linearGradient id="markTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#984cff"/>
      <stop offset=".52" stop-color="#7138f2"/>
      <stop offset="1" stop-color="#5427d5"/>
    </linearGradient>
    <linearGradient id="markBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6730e8"/>
      <stop offset=".55" stop-color="#4e24ce"/>
      <stop offset="1" stop-color="#351a9e"/>
    </linearGradient>
    <linearGradient id="cursorFill" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f5edff"/>
      <stop offset="1" stop-color="#d9c4ff"/>
    </linearGradient>
    <linearGradient id="cursorStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a34cff"/>
      <stop offset=".55" stop-color="#7734ff"/>
      <stop offset="1" stop-color="#5421e7"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0.45 0 0 0 0.24
                0 0.12 0 0 0.05
                0 0 0.9 0 0.9
                0 0 0 0.7 0" result="tint"/>
      <feMerge><feMergeNode in="tint"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Two-piece mark with a tall, centered negative-space interlock. -->
  <g transform="translate(256 256) rotate(16) translate(-256 -256)" filter="url(#softGlow)">
    <g transform="translate(0 35.84) scale(1 .86)">
      <path d="M114 62 H398 Q418 62 418 82 V232
               H288 V222 Q288 212 278 212 H234
               Q224 212 224 222 V232 H94 V82 Q94 62 114 62 Z"
            fill="url(#markTop)"/>
      <path d="M94 280 H224 V290 Q224 300 234 300 H278
               Q288 300 288 290 V280 H418 V422
               Q418 442 398 442 H114 Q94 442 94 422 Z"
            fill="url(#markBottom)"/>
    </g>
  </g>

  <!-- Pointer silhouette, intentionally prominent at small sizes -->
  <g transform="translate(8 28) translate(105 188) scale(1.12) translate(-105 -188)">
  <path d="M105 188
           Q102 176 115 183
           L290 304
           Q305 315 288 322
           L249 337
           L285 393
           Q290 402 280 408
           L261 420
           Q252 425 246 415
           L211 359
           L183 391
           Q172 404 168 386 Z"
        fill="url(#cursorStroke)" opacity=".98"/>
  <path d="M122 211
           L270 313
           L224 331
           L260 389
           L253 394
           L216 335
           L184 372 Z"
        fill="url(#cursorFill)" stroke="#e5d5ff" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
