<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>veyro</title>
  <desc>A tilted two-piece geometric mark with an interlocking notch and a bold lightning bolt, on a transparent background.</desc>
  <defs>
    <linearGradient id="markTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/><stop offset=".5" stop-color="#3a64ff"/><stop offset="1" stop-color="#2038d8"/>
    </linearGradient>
    <linearGradient id="markBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4cf0"/><stop offset=".55" stop-color="#1a2fb0"/><stop offset="1" stop-color="#0e1a6a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe45c"/>
    </linearGradient>
    <path id="topHalf" d="M114 62 H398 Q418 62 418 82 V232 H288 V222 Q288 212 278 212 H234 Q224 212 224 222 V232 H94 V82 Q94 62 114 62 Z"/>
    <path id="bottomHalf" d="M94 280 H224 V290 Q224 300 234 300 H278 Q288 300 288 290 V280 H418 V422 Q418 442 398 442 H114 Q94 442 94 422 Z"/>
    <path id="boltShape" d="M290 112 L166 290 H238 L212 410 L350 222 H270 Z"/>
  </defs>

  <g transform="translate(256 256) rotate(16) translate(-256 -256)">
    <g transform="translate(0 35.84) scale(1 .86)">
      <use href="#topHalf" fill="url(#markTop)"/>
      <use href="#bottomHalf" fill="url(#markBottom)"/>
    </g>
  </g>

  <g transform="translate(256 256) scale(.86) translate(-256 -256) translate(-92 38)">
  <use href="#boltShape" fill="url(#bolt)"/>
  </g>
</svg>
